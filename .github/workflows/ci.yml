name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Cut a release without pushing a tag first: the release job creates the tag
  # at the commit it built, so the APK on the release page always matches it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v3.1.0)'
        required: true
        type: string

jobs:
  build:
    name: Test, lint & assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Release APK & bundle
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # The job publishes the GitHub release, so it needs write access to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The APK is what people install from the release page; the bundle is
      # kept for a Play upload. Both are signed with the debug key (see
      # app/build.gradle.kts) — personal distribution, no Play signing setup.
      - name: Build release APK & bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      # gh ships on the runner, so no third-party action is needed here.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          APK: app/build/outputs/apk/release/app-release.apk
          AAB: app/build/outputs/bundle/release/app-release.aab
        run: |
          # api.github.com hands out 503s during incidents, and a five-minute
          # build shouldn't be thrown away over one. If a retry finds the
          # release already there, attach the files to it rather than failing.
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" \
                 --title "Bewsoa Flow $TAG" \
                 --generate-notes \
                 --target "$GITHUB_SHA" \
                 "$APK" "$AAB"
            then
              exit 0
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" --clobber "$APK" "$AAB" && exit 0
            fi
            echo "Publish attempt $attempt failed; retrying in $((attempt * 20))s."
            sleep $((attempt * 20))
          done
          echo "::error::Could not publish $TAG after 5 attempts."
          exit 1
